<footer class="site-footer relative overflow-hidden text-white">
  <div class="footer-glow" aria-hidden="true"></div>

  <div class="max-w-site mx-auto px-6 pt-14 pb-8 relative">
    <div class="grid gap-10 md:grid-cols-[1.4fr_1fr] items-start">
      <div>
        <app-brand-mark nameClass="text-white text-[1.1rem]" />
        <p class="mt-3 max-w-[26rem] text-[1.04rem] leading-relaxed text-white/70">
          {{ tagline[lang()] }}
        </p>
        <a
          href="#contact"
          class="footer-cta mt-6 inline-flex items-center gap-2 rounded-full px-5 py-2.5 text-[0.98rem] font-medium no-underline"
        >
          {{ items[items.length - 1].label[lang()] }}
          <span aria-hidden="true" class="footer-cta__arrow">→</span>
        </a>
      </div>

      <nav aria-label="Footer">
        <ul class="grid grid-cols-2 gap-x-8 gap-y-2 list-none m-0 p-0">
          @for (item of items; track item.id) {
            <li>
              <a [href]="'#' + item.id" class="footer-link no-underline">
                <span>{{ item.label[lang()] }}</span>
              </a>
            </li>
          }
        </ul>
      </nav>
    </div>

    <div class="mt-12 pt-6 border-t border-white/10 flex flex-col sm:flex-row justify-between items-center gap-4">
      <span class="text-[0.92rem] text-white/55">{{ footer.copyright }}</span>
      <a href="#home" class="back-top inline-flex items-center gap-2 text-[0.92rem] text-white/70 no-underline">
        {{ backToTop[lang()] }}
        <span aria-hidden="true" class="back-top__icon">↑</span>
      </a>
    </div>
  </div>
</footer>
