<section id="projects" class="py-20 border-b border-line">
  <div class="max-w-site mx-auto px-6">
    <div class="sa" appScrollAppear>
      <app-section-heading [heading]="projects" />

      @for (project of projects.items; track project.id) {
        <article
          class="proj grid grid-cols-1 gap-6 md:gap-10 items-start"
          [class]="project.slides ? 'md:grid-cols-[1.4fr_15rem]' : ''"
        >
          <div>
            <h3 class="text-[1.15rem]">{{ project.title[lang()] }}</h3>
            <p class="kicker mt-0.5 mb-4">{{ project.subtitle[lang()] }}</p>

            <ul class="proj-list mb-4">
              @for (highlight of project.highlights; track $index) {
                <li>{{ highlight[lang()] }}</li>
              }
            </ul>

            <div class="flex flex-wrap gap-1.5">
              @for (tag of project.tags; track tag) {
                <span class="sk-badge" [style]="badge(tag, project.theme.color)">{{ tag }}</span>
              }
            </div>
          </div>

          @if (project.slides; as slides) {
            <div class="proj-media">
              <app-carousel [slides]="slides" [link]="project.link" />
            </div>
          }
        </article>
      }
    </div>
  </div>
</section>
